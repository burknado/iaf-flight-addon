modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "IAF Flight Rework"
description = "Flight changes, reworks, and balance options for Ice and Fire: Community Edition."

[[dependencies.'${mod_id}']]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "iceandfire"
    type = "required"
    versionRange = "[2.0-beta.17,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
config = "iafflight.mixins.json"
